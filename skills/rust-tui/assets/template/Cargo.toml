[package]
name = "tui-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, mouse-first terminal app"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.12"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = "symbols"
