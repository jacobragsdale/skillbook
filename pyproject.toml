[project]
name = "skillbook"
version = "0.1.0"
description = "Jacob's canonical library of portable Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3,<7"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<5",
    "pytest>=9.1.1,<10",
    "pytest-randomly>=4,<5",
    "ruff==0.16.1",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 200
required-version = ">=0.16.1"
force-exclude = true
show-fixes = true
unsafe-fixes = false
extend-exclude = [
    # Bundled scripts are standalone PEP 723 tools with their own dependencies.
    "rules",
    "skills",
    "tests/test_jacob_create_skill.py",
]

[tool.ruff.lint]
extend-select = [
    "E4",
    "E7",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
    "PTH",
    "TC",
    "N",
    "A",
    "T20",
    "INP",
    "TID",
    "ERA",
    "EM",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ARG",
    "PGH",
    "RSE",
    "RET502",
    "RET503",
    "PLW",
    "C90",
    "PERF",
]
ignore = ["S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001"]
"**/test_*.py" = ["INP001"]
"**/conftest.py" = ["INP001"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
